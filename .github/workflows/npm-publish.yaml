name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (without leading v, e.g. 0.0.4). Must match an existing GitHub Release."
        required: true

jobs:
  npm-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            tag="${GITHUB_REF_NAME}"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync npm package version + copy LICENSE
        working-directory: npm
        run: |
          node -e "const fs=require('fs'); const p=require('./package.json'); p.version='${{ steps.ver.outputs.version }}'; fs.writeFileSync('package.json', JSON.stringify(p, null, 2)+'\n');"
          cp ../LICENSE LICENSE

      - name: Publish
        working-directory: npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
