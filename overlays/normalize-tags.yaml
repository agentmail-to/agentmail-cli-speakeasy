overlay: 1.0.0
info:
  title: Normalize tags + nest compound groups
  version: 0.0.2
# Two things happening here:
#
# 1. Acronym casing: Fern emits APIKeys / InboxesAPIKeys / PodsAPIKeys
#    because the source file is api-keys.yml. Speakeasy's kebab-case
#    conversion preserves consecutive-uppercase runs, producing
#    API-keys / inboxes-API-keys / pods-API-keys in the CLI. Rewrite
#    to PascalCase-per-word so they render as api-keys etc.
#
# 2. Compound tag nesting: Fern's OpenAPI export flattens hierarchy
#    into single tag strings (InboxesMessages, PodsDrafts). Without
#    help, Speakeasy produces client.inboxes_messages.inboxes_messages_send(...).
#    The x-speakeasy-group extension tells Speakeasy to build a nested
#    client tree so you get client.inboxes.messages.send(...) instead.
actions:
  # --- Acronym casing fixes ---
  - target: $.paths.*.*.tags[?(@ == 'APIKeys')]
    update: ApiKeys
  - target: $.paths.*.*.tags[?(@ == 'InboxesAPIKeys')]
    update: InboxesApiKeys
  - target: $.paths.*.*.tags[?(@ == 'PodsAPIKeys')]
    update: PodsApiKeys

  # --- Nest compound groups under inboxes.* ---
  - target: $.paths.*.*[?(@.tags && @.tags[0] == 'InboxesApiKeys')]
    update:
      x-speakeasy-group: inboxes.api_keys
  - target: $.paths.*.*[?(@.tags && @.tags[0] == 'InboxesDrafts')]
    update:
      x-speakeasy-group: inboxes.drafts
  - target: $.paths.*.*[?(@.tags && @.tags[0] == 'InboxesEvents')]
    update:
      x-speakeasy-group: inboxes.events
  - target: $.paths.*.*[?(@.tags && @.tags[0] == 'InboxesLists')]
    update:
      x-speakeasy-group: inboxes.lists
  - target: $.paths.*.*[?(@.tags && @.tags[0] == 'InboxesMessages')]
    update:
      x-speakeasy-group: inboxes.messages
  - target: $.paths.*.*[?(@.tags && @.tags[0] == 'InboxesMetrics')]
    update:
      x-speakeasy-group: inboxes.metrics
  - target: $.paths.*.*[?(@.tags && @.tags[0] == 'InboxesThreads')]
    update:
      x-speakeasy-group: inboxes.threads

  # --- Nest compound groups under pods.* ---
  - target: $.paths.*.*[?(@.tags && @.tags[0] == 'PodsApiKeys')]
    update:
      x-speakeasy-group: pods.api_keys
  - target: $.paths.*.*[?(@.tags && @.tags[0] == 'PodsDomains')]
    update:
      x-speakeasy-group: pods.domains
  - target: $.paths.*.*[?(@.tags && @.tags[0] == 'PodsDrafts')]
    update:
      x-speakeasy-group: pods.drafts
  - target: $.paths.*.*[?(@.tags && @.tags[0] == 'PodsInboxes')]
    update:
      x-speakeasy-group: pods.inboxes
  - target: $.paths.*.*[?(@.tags && @.tags[0] == 'PodsLists')]
    update:
      x-speakeasy-group: pods.lists
  - target: $.paths.*.*[?(@.tags && @.tags[0] == 'PodsMetrics')]
    update:
      x-speakeasy-group: pods.metrics
  - target: $.paths.*.*[?(@.tags && @.tags[0] == 'PodsThreads')]
    update:
      x-speakeasy-group: pods.threads
  - target: "$.paths['/v0/inboxes/{inbox_id}/drafts'].get"
    update:
      x-speakeasy-name-override: list
  - target: "$.paths['/v0/inboxes/{inbox_id}/drafts'].post"
    update:
      x-speakeasy-name-override: create
  - target: "$.paths['/v0/inboxes/{inbox_id}/drafts/{draft_id}'].get"
    update:
      x-speakeasy-name-override: get
  - target: "$.paths['/v0/inboxes/{inbox_id}/drafts/{draft_id}'].patch"
    update:
      x-speakeasy-name-override: update
  - target: "$.paths['/v0/inboxes/{inbox_id}/drafts/{draft_id}'].delete"
    update:
      x-speakeasy-name-override: delete
  - target: "$.paths['/v0/inboxes/{inbox_id}/drafts/{draft_id}/attachments/{attachment_id}'].get"
    update:
      x-speakeasy-name-override: getAttachment
  - target: "$.paths['/v0/inboxes/{inbox_id}/drafts/{draft_id}/send'].post"
    update:
      x-speakeasy-name-override: send
  - target: "$.paths['/v0/inboxes/{inbox_id}/events'].get"
    update:
      x-speakeasy-name-override: list
  - target: "$.paths['/v0/inboxes/{inbox_id}/lists/{direction}/{type}'].get"
    update:
