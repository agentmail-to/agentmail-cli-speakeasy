  # --- Named servers ---
  # Fern's OpenAPI export drops environment names (prod / prod-x402 / prod-mpp /
  # eu-prod) and emits raw URLs only, repeated under every operation. We:
  #   (a) tag each per-op server URL with x-speakeasy-server-id so per-op overrides
  #       can use named servers, and
  #   (b) inject a root-level servers block (which Fern omitted) so the SDK
  #       generates a top-level AgentmailServer.ProdX402-style constant matching
  #       Fern's existing AgentMailEnvironment.ProdX402 ergonomics.
  - target: $.paths.*.*.servers[?(@.url == 'https://api.agentmail.to')]
    update:
      x-speakeasy-server-id: prod
      description: Default production
  - target: $.paths.*.*.servers[?(@.url == 'https://x402.api.agentmail.to')]
    update:
      x-speakeasy-server-id: prod-x402
      description: x402 pay-per-use endpoint
  - target: $.paths.*.*.servers[?(@.url == 'https://mpp.api.agentmail.to')]
    update:
      x-speakeasy-server-id: prod-mpp
      description: MPP routing endpoint
  - target: $.paths.*.*.servers[?(@.url == 'https://api.agentmail.eu')]
    update:
      x-speakeasy-server-id: eu-prod
      description: EU production

  # Root-level servers block (missing from Fern's export)
  - target: $
    update:
      servers:
        - url: https://api.agentmail.to
          description: Default production
          x-speakeasy-server-id: prod
        - url: https://x402.api.agentmail.to
          description: x402 pay-per-use endpoint
          x-speakeasy-server-id: prod-x402
        - url: https://mpp.api.agentmail.to
          description: MPP routing endpoint
          x-speakeasy-server-id: prod-mpp
        - url: https://api.agentmail.eu
          description: EU production
          x-speakeasy-server-id: eu-prod